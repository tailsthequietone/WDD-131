<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Read For Fun</title>
    <link rel="stylesheet" href="blog.css">
    <script src="blog.js" defer></script>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1 class="site-title">Kids Read For Fun</h1>
        <nav aria-label="Main Navigation">
            <ul class="nav-links">
                <li><a href="#">About</a></li>
                <li><a href="#">Archive</a></li>
                <li><a href="#">Search</a></li>
            </ul>
        </nav>
    </header>
    <!-- Main Content Area -->
    <main>
        <section class="reviews-container">
            <!-- Book Review Article -->
            <article class="book-card">
                <!-- Book Metadata (Left column on desktop, top on mobile) -->
                <div class="book-meta">
                    <time class="post-date" datetime="2022-07-05">July 5, 2022</time>
                    <p class="age-range">10-14</p>
                    <p class="genre">Fantasy</p>
                    <p class="rating" aria-label="4 out of 5 stars">
                        <span aria-hidden="true">⭐⭐⭐⭐</span>
                    </p>
                </div>
                <!-- Main Book Details (Right column on desktop) -->
                <div class="book-content">
                    <h2 class="book-title">Septimus Heap Book One: Magyk</h2>
                    <img 
                        src="https://upload.wikimedia.org/wikipedia/en/5/5f/Magkycover2.jpg" 
                        alt="Book cover for Septimus Heap Book One: Magyk by Angie Sage showing a blue journal with gold embellishments and a ring" 
                        class="book-cover"
                        width="200" 
                        height="300"
                    >
                    <p class="book-description">
                        If you enjoy stories about seventh sons of seventh sons and magyk this is the book for you.
                    </p>
                </div>
            </article>
        </section>
    </main>

    <!-- Footer Section -->
    <footer>
        <p class="author">Jane Doe</p>
    </footer>

</body>
</html>
