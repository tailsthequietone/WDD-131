<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeBook</title>
  <meta name="description" content="A collection of delicious, easy-to-follow recipes including classic fall Apple Crisp.">
  <meta name="author" content="WDD 131 Student">

  <!-- Open Graph (Facebook, LinkedIn, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="RecipeBook">
  <meta property="og:description" content="A collection of delicious, easy-to-follow recipes including classic fall Apple Crisp.">
  <meta property="og:url" content="https://githubusername.github.io/wdd131/recipes/">
  <meta property="og:image" content="social-preview-image.png">

  <!-- X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RecipeBook">
  <meta name="twitter:description" content="A collection of delicious, easy-to-follow recipes including classic fall Apple Crisp.">
  <meta name="twitter:image" content="social-preview-image.png">

  <!-- One favicon (ICO works everywhere) -->
  <link rel="icon" href="favicon.ico">

  <!-- One Apple Touch Icon (iOS home screen) -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <!-- Google Fonts: Amatic SC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="recipes.css">
</head>
<body>
  <header>
    <div class="logo-title">
      <img src="images/recipe-book.svg" alt="RecipeBook logo" class="logo">
      <h1>RecipeBook</h1>
    </div>

    <form class="search-form" action="#" method="get">
      <input type="text" id="search" name="search" placeholder="Find a recipe" aria-label="Find a recipe">
      <button type="submit" aria-label="Search">
        <img src="images/search.svg" alt="Search icon">
      </button>
    </form>
  </header>

  <hr class="divider">

  <main>
    <article class="recipe-card">
      <img src="images/apple-crisp.jpg" alt="Warm apple crisp topped with a scoop of vanilla ice cream" class="recipe-image">
      <div class="recipe-details">
        <ul class="recipe-tags">
          <li>dessert</li>
        </ul>
        <h2 class="recipe-title"><a href="#">Apple Crisp</a></h2>
        <span
          class="rating"
          role="img"
          aria-label="Rating: 4 out of 5 stars"
        >
          <span aria-hidden="true" class="icon-star">★</span>
          <span aria-hidden="true" class="icon-star">★</span>
          <span aria-hidden="true" class="icon-star">★</span>
          <span aria-hidden="true" class="icon-star">★</span>
          <span aria-hidden="true" class="icon-star-empty">☆</span>
        </span>
        <p class="recipe-description">
          This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.
        </p>
      </div>
    </article>
  </main>

  <footer>
    <div class="social">
      <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
      <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
      <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
      <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
    </div>
    <a class="attribution" href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
  </footer>
</body>
</html>
