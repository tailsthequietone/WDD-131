<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:type" content="website">

    <link rel="stylesheet" href="styles.css">
    <script src="character.js" defer></script>
</head>
<body>
    <main class="card">
        <img id="char-image" class="image" src="1776278033434258722-9dae73f1-4470-4621-b43f-8b41f403d758-2212264344.jpg" alt="Character Portrait">
        <div id="char-name" class="name">Name</div>
        <div class="stats">
            <p><strong>Class:</strong> <span id="char-class">Class</span></p>
            <p><strong>Level:</strong> <span id="char-level">1</span></p>
            <p><strong>Health:</strong> <span id="char-health">100</span></p>
        </div>
        <div class="buttons">
            <button id="attack-btn">Attacked</button>
            <button id="levelup-btn">Level Up</button>
        </div>
    </main>
</body>
</html>
